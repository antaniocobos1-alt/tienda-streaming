<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Cuentas Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Navegación -->
    <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-play-circle"></i> Streaming Store
            </h1>
            <div class="flex items-center gap-4">
                <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 text-sm">
                    Saldo: <span id="user-balance" class="text-emerald-400 font-bold">$0.00</span> MXN
                </div>
                <button onclick="switchTab('admin')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded transition">
                    <i class="fa-solid fa-lock"></i> Admin
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-8">

        <!-- Sección Tienda (Clientes) -->
        <section id="tab-shop" class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold">Catálogo de Cuentas</h2>
                <button onclick="openTopUpModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-wallet"></i> Recargar Saldo
                </button>
            </div>

            <!-- Grilla de Productos -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="products-grid">
                <!-- Se cargan dinámicamente con JS -->
            </div>

            <!-- Historial de Compras -->
            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 mt-8 space-y-4">
                <h3 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left"></i> Mis Cuentas Compradas
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900 text-slate-400">
                            <tr>
                                <th class="p-3">Servicio</th>
                                <th class="p-3">Credenciales / Datos de Acceso</th>
                                <th class="p-3">Precio</th>
                                <th class="p-3">Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="purchases-list" class="divide-y divide-slate-700">
                            <!-- Se carga con JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Panel de Administración (Sólo Admin) -->
        <section id="tab-admin" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-amber-400"><i class="fa-solid fa-user-shield"></i> Panel Administrador</h2>
                <button onclick="switchTab('shop')" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg">
                    Volver a Tienda
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Agregar Crédito a Cliente -->
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                    <h3 class="font-bold text-lg text-emerald-400"><i class="fa-solid fa-plus-circle"></i> Agregar Crédito a Cliente</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-slate-400">Monto a abonar (MXN)</label>
                            <input type="number" id="add-credit-amount" value="100" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm mt-1">
                        </div>
                        <button onclick="addCredit()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-medium py-2 rounded-lg text-sm transition">
                            Añadir Crédito al Cliente
                        </button>
                    </div>
                </div>

                <!-- Cargar Stock de Cuentas -->
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                    <h3 class="font-bold text-lg text-indigo-400"><i class="fa-solid fa-box-archive"></i> Cargar Inventario de Cuentas</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-slate-400">Seleccionar Producto</label>
                            <select id="stock-product-id" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm mt-1">
                                <!-- Opciones cargadas por JS -->
